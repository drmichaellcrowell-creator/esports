name: CI

on:
  pull_request:
  push:
    branches: [main]

# No cloud credentials are used anywhere in this workflow. Integration tests run
# against a throwaway PostgreSQL service container, never a real environment.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Consumed by tests/helpers/postgres.ts. Each test file creates and drops
      # its own database on this server, so migrations always run against an
      # empty database. Absent this, the helper falls back to Testcontainers.
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Test
        working-directory: backend
        run: npm test

      - name: Build
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (includes typecheck)
        working-directory: frontend
        run: npm run build

  boundaries:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Frontend must not depend on Base44
        run: |
          if grep -rn '@base44' frontend/package.json frontend/src 2>/dev/null; then
            echo "::error::Base44 must remain a preview harness, never a dependency."
            exit 1
          fi
          echo "ok: no @base44 dependency"

      - name: Frontend must not access the database or Supabase data directly
        run: |
          if grep -rniE '@supabase/|createClient\(|postgres://|postgresql://' frontend/src 2>/dev/null; then
            echo "::error::Option B: the browser has no direct database or Supabase data access."
            exit 1
          fi
          echo "ok: no direct data access from the frontend"

      - name: Canonical architecture documents must not change outside an amendment gate
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- \
            docs/architecture/implementation-contract.md \
            docs/architecture/implementation-handoff.md \
            'docs/architecture/amendments/**')
          if [ -n "$changed" ]; then
            echo "::warning::Canonical architecture documents changed: $changed"
            echo "This is only permitted in a dedicated architecture amendment gate."
          fi
          echo "ok: checked"
